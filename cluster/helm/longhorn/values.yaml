# Chart version from charts.longhorn.io. ./deploy takes it as its first
# argument and overrides this, so the default only documents the last
# applied version for Renovate to bump.
chartVersion: "1.12.1"

global:
  pullPolicy: IfNotPresent
  cattle:
    systemDefaultRegistry: ""
    windowsCluster:
      # Enable this to allow Longhorn to run on the Rancher deployed Windows cluster
      enabled: false
      # Tolerate Linux node taint
      tolerations:
        - key: cattle.io/os
          value: linux
          effect: NoSchedule
          operator: Equal
      # Select Linux nodes
      nodeSelector:
        kubernetes.io/os: linux
      # Recognize toleration and node selector for Longhorn run-time created components
      defaultSetting:
        taintToleration: cattle.io/os=linux:NoSchedule
        systemManagedComponentsNodeSelector: kubernetes.io/os:linux
        image:
          longhorn:
            engine:
              repository: longhornio/longhorn-engine
              #tag: v1.5.3
            manager:
              repository: longhornio/longhorn-manager
              #tag: v1.11.0
            ui:
              repository: longhornio/longhorn-ui
              #tag: v1.5.3
            instanceManager:
              repository: longhornio/longhorn-instance-manager
              #tag: v1.5.3
            shareManager:
              repository: longhornio/longhorn-share-manager
              #tag: v1.5.3
            backingImageManager:
              repository: longhornio/backing-image-manager
              #tag: v1.5.3
            supportBundleKit:
              repository: longhornio/support-bundle-kit
              #tag: v0.0.17
          csi:
            attacher:
              repository: longhornio/csi-attacher
              #tag: v4.7.0
            provisioner:
              repository: longhornio/csi-provisioner
              #tag: v5.1.0
            nodeDriverRegistrar:
              repository: longhornio/csi-node-driver-registrar
              #tag: v2.10.1
            resizer:
              repository: longhornio/csi-resizer
              #tag: v1.12.0
            snapshotter:
              repository: longhornio/csi-snapshotter
              #tag: v8.1.0
            livenessProbe:
              repository: longhornio/livenessprobe
              #tag: v2.11.0
service:
  ui:
    type: ClusterIP
  manager:
    type: ClusterIP
    nodePort: ""
    loadBalancerIP: ""
    loadBalancerSourceRanges: ""

persistence:
  defaultClass: true
  defaultFsType: ext4
  defaultMkfsParams: -m 0 -b 4096
  defaultClassReplicaCount: 3
  # best-effort otherwise
  defaultDataLocality: best-effort
  reclaimPolicy: Retain
  # reclaimPolicy: Delete
  migratable: true
  recurringJobSelector:
    enable: false
    jobList: []
  backingImage:
    enable: false
    name: null
    dataSourceType: null
    dataSourceParameters: null
    expectedChecksum: null
  defaultNodeSelector:
    # disable by default
    enable: true
    selector: worker
  # "enabled" or "disabled" otherwise
  removeSnapshotsDuringFilesystemTrim: ignored

csi:
  kubeletRootDir: null
  attacherReplicaCount: 1
  provisionerReplicaCount: 1
  resizerReplicaCount: 1
  snapshotterReplicaCount: 1

# Nodes that must not store volume replicas, applied by ./deploy. The chart has
# no setting for per-node allowScheduling, so it cannot live under defaultSettings.
storageNodes:
  exclude:
    - rpi-k3s-master-00

defaultSettings:
  allowRecurringJobWhileVolumeDetached: null
  createDefaultDiskLabeledNodes: false
  defaultDataPath: /k3s/storage
  defaultDataLocality: best-effort
  replicaSoftAntiAffinity: null
  replicaAutoBalance: best-effort
  storageOverProvisioningPercentage: "200"
  # Matches the value already set on the running cluster. Without it Longhorn
  # may schedule 2x real capacity (see the setting above) and fill a node.
  storageMinimalAvailablePercentage: "25"
  upgradeChecker: false
  defaultReplicaCount: "2"
  defaultLonghornStaticStorageClass: longhorn-static
  backupstorePollInterval: 0
  taintToleration: null
  systemManagedComponentsNodeSelector: null
  systemManagedCSIComponentsResourceLimits: >-
    {"csi-attacher":{"requests":{"memory":"80Mi"},"limits":{"memory":"128Mi"}},"csi-provisioner":{"requests":{"memory":"80Mi"},"limits":{"memory":"128Mi"}},"csi-resizer":{"requests":{"memory":"64Mi"},"limits":{"memory":"112Mi"}},"csi-snapshotter":{"requests":{"memory":"96Mi"},"limits":{"memory":"128Mi"}},"longhorn-csi-plugin":{"requests":{"memory":"64Mi"},"limits":{"memory":"112Mi"}},"node-driver-registrar":{"requests":{"memory":"32Mi"},"limits":{"memory":"48Mi"}},"longhorn-liveness-probe":{"requests":{"memory":"32Mi"},"limits":{"memory":"64Mi"}}}
  priorityClass: null
  autoSalvage: true
  autoDeletePodWhenVolumeDetachedUnexpectedly: true
  disableSchedulingOnCordonedNode: true
  replicaZoneSoftAntiAffinity: true
  nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
  allowNodeDrainWithLastHealthyReplica: null
  mkfsExt4Parameters: null
  disableReplicaRebuild: null
  replicaReplenishmentWaitInterval: null
  disableRevisionCounter: null
  systemManagedPodsImagePullPolicy: null
  allowVolumeCreationWithDegradedAvailability: false
  autoCleanupSystemGeneratedSnapshot: true
  snapshotDataIntegrity: fast-check
  concurrentAutomaticEngineUpgradePerNodeLimit: "3"
  backingImageCleanupWaitInterval: "60"
  backingImageRecoveryWaitInterval: null
  guaranteedEngineManagerCPU: null
  guaranteedReplicaManagerCPU: null
  kubernetesClusterAutoscalerEnabled: null
  orphanAutoDeletion: true
  fastReplicaRebuildEnabled: "true"

privateRegistry:
  registryUrl: null
  registryUser: null
  registryPasswd: null
  registrySecret: null

longhornManager:
  log:
    ## Allowed values are `plain` or `json`.
    format: plain
  resources:
    requests:
      memory: 192Mi
    limits:
      memory: 288Mi
  priorityClass: null
  tolerations: []
  nodeSelector: {}
  serviceAnnotations: {}

longhornDriver:
  priorityClass: null
  tolerations: []
  nodeSelector: {}

longhornUI:
  replicas: 1
  priorityClass: null
  tolerations: []
  nodeSelector:
    kubernetes.io/role: worker

longhornConversionWebhook:
  replicas: 1
  priorityClass: null
  tolerations: []
  nodeSelector: {}

longhornAdmissionWebhook:
  replicas: 1
  priorityClass: null
  tolerations: []
  nodeSelector: {}

longhornRecoveryBackend:
  replicas: 1
  priorityClass: null
  tolerations: []
  nodeSelector: {}

ingress:
  enabled: false
  host: longhorn.home
  secrets: null

# No middleware on this route: the upstream httproute.yaml template has no
# filters hook, not even the HTTPS redirect. Longhorn has its own login page.
httproute:
  enabled: true
  hostnames:
    - longhorn.home
  parentRefs:
    - name: traefik-internal-gateway
      namespace: traefik
      kind: Gateway
      sectionName: websecure

enablePSP: false
namespaceOverride: ""

annotations:
  prometheus.io/port: "9500"
  prometheus.io/scrape: "true"
