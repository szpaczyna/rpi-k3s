---
# Non-secret values. Credentials come from values.enc.yaml (Gitea, Pi-hole,
# Booklore), from deploy (UniFi, read out of unifipoller's sops file) and from
# the media-exporter Secret (*arr API keys, see extraEnv).

image:
  repository: ghcr.io/gethomepage/homepage
  tag: v2.7.0
  pullPolicy: IfNotPresent

service:
  port: 3000

resources:
  requests:
    cpu: 50m
    memory: 160Mi
  limits:
    cpu: 500m
    memory: 512Mi

nodeSelector:
  kubernetes.io/role: worker

httpRoute:
  enabled: true
  hostname: homepage.home
  parentRefs:
    - name: traefik-internal-gateway
      namespace: traefik
      kind: Gateway
      sectionName: websecure

# Rendered into the <release>-env Secret; values.enc.yaml and deploy fill it in.
env: {}

extraEnv:
  - name: LOG_TARGETS
    value: stdout
  # optional: a missing key breaks one widget instead of blocking the pod.
  - name: HOMEPAGE_VAR_SONARR_KEY
    valueFrom:
      secretKeyRef: {name: media-exporter, key: SONARR_APIKEY, optional: true}
  - name: HOMEPAGE_VAR_RADARR_KEY
    valueFrom:
      secretKeyRef: {name: media-exporter, key: RADARR_APIKEY, optional: true}
  - name: HOMEPAGE_VAR_LIDARR_KEY
    valueFrom:
      secretKeyRef: {name: media-exporter, key: LIDARR_APIKEY, optional: true}
  - name: HOMEPAGE_VAR_READARR_KEY
    valueFrom:
      secretKeyRef: {name: media-exporter, key: READARR_APIKEY, optional: true}
  - name: HOMEPAGE_VAR_PROWLARR_KEY
    valueFrom:
      secretKeyRef: {name: media-exporter, key: PROWLARR_APIKEY, optional: true}
  - name: HOMEPAGE_VAR_BAZARR_KEY
    valueFrom:
      secretKeyRef: {name: media-exporter, key: BAZARR_APIKEY, optional: true}

# One entry per file in /app/config. Widget URLs use in-cluster Service names;
# href values are what the browser opens, so they stay on *.home (Gitea and
# Booklore have no *.home route and link to shpaq.org).
config:
  kubernetes.yaml: |
    mode: cluster
    ingress: false
    traefik: false
    gateway: false

  settings.yaml: |
    title: Szpacze Gniazdo
    theme: dark
    color: slate
    headerStyle: clean
    statusStyle: dot
    useEqualHeights: true
    hideVersion: true
    background:
      image: https://images.unsplash.com/photo-1502790671504-542ad42d5189?auto=format&fit=crop&w=2560&q=80
      blur: sm
      saturate: 50
      brightness: 50
      opacity: 50
    cardBlur: md
    layout:
      Servers:
        style: row
        columns: 3
      Media:
        style: row
        columns: 3
      Network:
        style: row
        columns: 4
      Dev:
        style: row
        columns: 2
      Monitoring:
        style: row
        columns: 4

  widgets.yaml: |
    - search:
        provider: [google, duckduckgo]
        focus: true
        target: _blank
    - openmeteo:
        label: Warsaw
        latitude: 52.2297
        longitude: 21.0122
        timezone: Europe/Warsaw
        units: metric
        cache: 5

  # Empty string stops Homepage from copying its skeleton bookmarks.
  bookmarks.yaml: ""

  services.yaml: |
    - Servers:
        - rpi-k3s:
            icon: kubernetes.png
            widget:
              type: customapi
              url: "http://prometheus-server.monitoring.svc.cluster.local:9090/api/v1/query?query=label_replace%28round%28100%20%2A%20%281%20-%20avg%28rate%28node_cpu_seconds_total%7Bservice%3D%22prometheus-node-exporter%22%2Cmode%3D%22idle%22%7D%5B5m%5D%29%29%29%2C%201%29%20or%20vector%28-1%29%2C%20%22m%22%2C%20%22cpu%22%2C%20%22%22%2C%20%22%22%29%20or%20label_replace%28round%28100%20%2A%20%281%20-%20sum%28node_memory_MemAvailable_bytes%7Bservice%3D%22prometheus-node-exporter%22%7D%29%20%2F%20sum%28node_memory_MemTotal_bytes%7Bservice%3D%22prometheus-node-exporter%22%7D%29%29%2C%201%29%20or%20vector%28-1%29%2C%20%22m%22%2C%20%22mem%22%2C%20%22%22%2C%20%22%22%29%20or%20label_replace%28round%28sum%28node_memory_MemAvailable_bytes%7Bservice%3D%22prometheus-node-exporter%22%7D%29%20%2F%201048576%2C%201%29%20or%20vector%28-1%29%2C%20%22m%22%2C%20%22free%22%2C%20%22%22%2C%20%22%22%29%20or%20label_replace%28round%28count%28up%7Bservice%3D%22prometheus-node-exporter%22%7D%20%3D%3D%201%29%2C%201%29%20or%20vector%28-1%29%2C%20%22m%22%2C%20%22nodes%22%2C%20%22%22%2C%20%22%22%29"
