              url: "http://prometheus-server.monitoring.svc.cluster.local:9090/api/v1/query?query=label_replace%28round%28100%20%2A%20%281%20-%20avg%28rate%28node_cpu_seconds_total%7Binstance%3D%2210.0.0.23%3A9100%22%2Cmode%3D%22idle%22%7D%5B5m%5D%29%29%29%2C%201%29%20or%20vector%28-1%29%2C%20%22m%22%2C%20%22cpu%22%2C%20%22%22%2C%20%22%22%29%20or%20label_replace%28round%28max%28100%20%2A%20%281%20-%20node_memory_MemAvailable_bytes%7Binstance%3D%2210.0.0.23%3A9100%22%7D%20%2F%20node_memory_MemTotal_bytes%7Binstance%3D%2210.0.0.23%3A9100%22%7D%29%29%2C%201%29%20or%20vector%28-1%29%2C%20%22m%22%2C%20%22mem%22%2C%20%22%22%2C%20%22%22%29%20or%20label_replace%28round%28max%28node_memory_MemAvailable_bytes%7Binstance%3D%2210.0.0.23%3A9100%22%7D%29%20%2F%201048576%2C%201%29%20or%20vector%28-1%29%2C%20%22m%22%2C%20%22free%22%2C%20%22%22%2C%20%22%22%29%20or%20label_replace%28round%28max%28node_thermal_zone_temp%7Binstance%3D%2210.0.0.23%3A9100%22%7D%29%2C%200.1%29%20or%20vector%28-1%29%2C%20%22m%22%2C%20%22temp%22%2C%20%22%22%2C%20%22%22%29"
              refreshInterval: 30000
              mappings:
                - field: data.result.0.value.1
                  label: CPU
                  suffix: "%"
                  remap:
                    - value: "-1"
                      to: "-"
                - field: data.result.1.value.1
                  label: RAM
                  suffix: "%"
                  remap:
                    - value: "-1"
                      to: "-"
                - field: data.result.2.value.1
                  label: Free
                  suffix: "MiB"
                  remap:
                    - value: "-1"
                      to: "-"
                - field: data.result.3.value.1
                  label: Temp
                  suffix: "°C"
                  remap:
                    - value: "-1"
                      to: "-"

