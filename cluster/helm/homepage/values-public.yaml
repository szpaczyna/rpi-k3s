    - Dev:
        - GitHub:
            icon: github.png
            href: https://github.com/szpaczyna
            widgets:
              - type: customapi
                url: https://api.github.com/user
                refreshInterval: 120000
                headers:
                  Authorization: "Bearer {{HOMEPAGE_VAR_GITHUB_TOKEN}}"
                  User-Agent: homepage
                mappings:
                  - field: public_repos
                    label: Public
                  - field: total_private_repos
                    label: Private
                  - field: followers
                    label: Followers
              - type: customapi
                url: "https://api.github.com/search/issues?q=is%3Apr+is%3Aopen+user%3Aszpaczyna&sort=updated&per_page=50"
                display: dynamic-list
                refreshInterval: 120000
                headers:
                  Authorization: "Bearer {{HOMEPAGE_VAR_GITHUB_TOKEN}}"
                  User-Agent: homepage
                mappings:
                  items: items
                  name: title
                  label: number
                  prefix: "#"
                  target: "{html_url}"
        - Docker Hub:
            icon: docker.png
            href: https://hub.docker.com/u/szpaczyn
            widgets:
              - type: customapi
                url: https://hub.docker.com/v2/repositories/szpaczyn/?page_size=1
                refreshInterval: 600000
                mappings:
                  - field: count
                    label: Images
              - type: customapi
                url: "https://hub.docker.com/v2/repositories/szpaczyn/?page_size=40&ordering=pull_count"
                display: dynamic-list
                refreshInterval: 600000
                mappings:
                  items: results
                  name: name
                  label: pull_count
                  format: number
                  target: "https://hub.docker.com/r/szpaczyn/{name}"
