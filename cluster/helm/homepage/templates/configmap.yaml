apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "homepage.labels" . | nindent 4 }}
data:
  {{- range $file, $content := .Values.config }}
  {{- if $content }}
  {{ $file }}: |
    {{- $content | nindent 4 }}
  {{- else }}
  {{ $file }}: ""
  {{- end }}
  {{- end }}
