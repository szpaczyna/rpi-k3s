hostname: pihole.home

# External Pi-hole IP (selector-less Service + manual Endpoints)
upstreamIP: 10.0.0.2
upstreamPort: 80

service:
  port: 80

httpRoute:
  enabled: true
  parentRefs:
    - name: traefik-internal-gateway
      namespace: traefik
      kind: Gateway
      sectionName: websecure
