# Selector-less Service + manual EndpointSlice.
# Gateway API does not support ExternalName Services as backendRefs,
# so this is the standard pattern for pointing at an external host.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: {{ .Release.Name }}-local
  namespace: {{ .Release.Namespace }}
  labels:
    kubernetes.io/service-name: {{ .Release.Name }}
addressType: IPv4
ports:
  - port: {{ .Values.upstreamPort }}
    protocol: TCP
endpoints:
  - addresses:
      - {{ .Values.upstreamIP | quote }}
    conditions:
      ready: true
