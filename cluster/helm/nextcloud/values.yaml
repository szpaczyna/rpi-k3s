---
image:
  repository: nextcloud
  tag: 30.0.17
    #tag: 29.0.5
  pullPolicy: IfNotPresent

nameOverride: cloud
fullnameOverride: cloud
replicas: 1

ingress:
  enabled: false

# Gateway API equivalent of the (disabled) nginx ingress above.
# Kept disabled: nextcloud has never actually been deployed (no live
# release found on cluster), so there's no traffic to migrate yet.
# Flip to true when ready to deploy for real, and review the caveats below
# first.
#
# Ported 1:1 via the chart's native wellKnown option:
#   - /.well-known/carddav, /.well-known/caldav redirects -> RequestRedirect
#     (chart handles this natively, see httpRoute.wellKnown.enabled below)
#
# NOT ported (no clean Gateway API / Traefik equivalent, needs manual
# follow-up before going live):
#   - deny-all on /build, /tests, /config, /lib, /3rdparty, /templates,
#     /data, /autotest, /occ, /issue, /indie, /db_, /console
#     (nginx returned 403; Gateway API/Traefik has no "deny" primitive -
#     would need a dedicated 403-responding backend Service, or leaving
#     these paths unrouted so they simply 404 instead of 403)
#   - server_tokens off / proxy_hide_header X-Powered-By
#     (needs a Traefik `headers` Middleware with response header removal)
#   - client_max_body_size 500m / proxy-body-size
#     (no direct Traefik equivalent; closest is the `buffering` middleware's
#     maxRequestBodyBytes, semantics differ slightly from nginx)
#   - proxy-read-timeout 360 / proxy-buffering on
#     (needs a Traefik ServersTransport CRD, not configurable via HTTPRoute)
#   - nginx.ingress.kubernetes.io/default-backend: shpaq-org
#     (nginx-specific fallback-on-no-endpoints behavior; no Gateway API
#     equivalent, would need a catch-all HTTPRoute rule instead)
httpRoute:
  enabled: false
  parentRefs:
    - name: traefik-gateway
      namespace: kube-system
      kind: Gateway
      sectionName: websecure
  hostnames:
    - cloud.shpaq.org
  wellKnown:
    enabled: true
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: "/"

extraManifests:
  - apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: nextcloud-strip-headers
      namespace: apps
    spec:
      headers:
        customResponseHeaders:
          X-Powered-By: ""
          Server: ""

lifecycle: {}
# postStartCommand: []
# preStopCommand: []

nextcloud:
  host: cloud.shpaq.org
  existingSecret:
    enabled: true
    secretName: cloud-admin-secret
    usernameKey: username
    passwordKey: password
    # smtpUsernameKey: smtp_username
    # smtpPasswordKey: smtp_password
  update: 1
  containerPort: 80
  datadir: /var/www/html/data
  persistence:
    subPath: null
  mail:
    enabled: false
    fromAddress: user
    domain: domain.com
    smtp:
      host: domain.com
      secure: ssl
      port: 465
      authtype: LOGIN
      name: user
      password: pass
            # PHP Configuration files
            # Will be injected in /usr/local/etc/php/conf.d for apache image and in /usr/local/etc/php-fpm.d when nginx.enabled: true
  phpConfigs: {}

  defaultConfigs:
    .htaccess: true
    redis.config.php: true
    apache-pretty-urls.config.php: true
    apcu.config.php: true
    apps.config.php: true
    autoconfig.php: true
    smtp.config.php: true

  configs: {}
    # For example, to use S3 as primary storage
    # ref: https://docs.nextcloud.com/server/13/admin_manual/configuration_files/primary_storage.html#simple-storage-service-s3
    #
    #  configs:
    #    s3.config.php: |-
    #      <?php
    #      $CONFIG = array (
    #        'objectstore' => array(
    #          'class' => '\\OC\\Files\\ObjectStore\\S3',
    #          'arguments' => array(
    #            'bucket'     => 'my-bucket',
    #            'autocreate' => true,
    #            'key'        => 'xxx',
    #            'secret'     => 'xxx',
    #            'region'     => 'us-east-1',
    #            'use_ssl'    => true
    #          )
    #        )
    #      );
    #type: Recreate

  strategy:
    type: Recreate
      #type: RollingUpdate
      #rollingUpdate:
      #maxSurge: 1
      #maxUnavailable: 0

  extraEnv: null
    #  - name: nfs
    #    nfs:
    #      server: "10.0.0.1"
    #      path: "/nextcloud_data"
    #      readOnly: false
  extraVolumes: null
    #  - name: nfs
    #    mountPath: "/legacy_data"
    # Extra secuurityContext parameters. For example you may need to define runAsNonRoot directive

  extraVolumeMounts: null
  extraSecurityContext:
    runAsUser: "33"
    runAsGroup: "33"
    runAsNonRoot: true
    readOnlyRootFilesystem: true

nginx:
  enabled: false

## External database configuration
externalDatabase:
  enabled: true
  type: postgresql
  host: morphine-postgresql-primary-hl
  existingSecret:
    enabled: true
    secretName: cloud-db-creds
    usernameKey: username
    passwordKey: password
    databaseKey: database

internalDatabase:
  enabled: false

mariadb:
  enabled: false

postgresql:
  enabled: false

redis:
  enabled: false

cronjob:
  enabled: true
  image:
    repository: curlimages/curl
    tag: 8.21.0
    pullPolicy: IfNotPresent
  schedule: '*/5 * * * *'
  annotations: {}
  # Set curl's insecure option if you use e.g. self-signed certificates
  curlInsecure: false
  failedJobsHistoryLimit: 2
  successfulJobsHistoryLimit: 1

service:
  type: ClusterIP
  port: 80
  loadBalancerIP: nil
    #nodePort: nil

persistence:
  enabled: true
  annotations:
    helm.sh/resource-policy: keep
  storageClass: longhorn
  accessMode: ReadWriteOnce
  size: 3Gi
  nextcloudData:
    enabled: true
    subpath:
    annotations: {}
    existingClaim: cloud
    storageClass: local-path
    accessMode: ReadWriteOnce
    size: 300Gi

resources:
  requests:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  enabled: false
  initialDelaySeconds: 360
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 10
  successThreshold: 1

readinessProbe:
  enabled: false
  initialDelaySeconds: 360
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 10
  successThreshold: 1

startupProbe:
  enabled: false
  initialDelaySeconds: 360
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30
  successThreshold: 1

hpa:
  enabled: false
  cputhreshold: 81
  minPods: 1
  maxPods: 2

nodeSelector:
  kubernetes.io/role: worker

tolerations: []
affinity: {}

## Prometheus Exporter / Metrics
metrics:
  enabled: false
  replicaCount: 1
  https: true
  timeout: 5s
  image:
    repository: szpaczyn/nextcloud_exporter-arm64
    tag: v0.4.0
    pullPolicy: IfNotPresent
        # resources: {}
        # podAnnotations: {}
    podLabels:
      app.kubernetes.io/name: cloud
    service:
      type: ClusterIP
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9205"
      labels:
        app.kubernetes.io/name: cloud

rbac:
  enabled: true
  serviceaccount:
    create: true
    name: cloud
