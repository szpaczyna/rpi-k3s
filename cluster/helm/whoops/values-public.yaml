---
# Default values for whoops.

replicaCount: 1

image:
  repository: szpaczyn/whoops
  pullPolicy: Always
  tag: 1.1.1

service:
  type: ClusterIP
  port: 5000

auth:
  secretName: whoops-auth

httpRoute:
  enabled: true
  host: whoops.shpaq.org
  parentRefs:
    - name: traefik-gateway
      namespace: kube-system
      kind: Gateway
      sectionName: websecure
