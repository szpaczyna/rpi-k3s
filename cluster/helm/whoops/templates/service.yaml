apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "whoops.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "whoops.selectorLabels" . | nindent 4 }}
  ports:
    - protocol: "TCP"
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
