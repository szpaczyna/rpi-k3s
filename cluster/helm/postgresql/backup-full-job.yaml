---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-full-backup
  namespace: apps
spec:
  schedule: "0 1 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: postgres-full-backup
            image: postgres:18.6
            command: ["/bin/sh"]
            args:
              - "-c"
              - |
                echo "$PGPASS" > /root/.pgpass && chmod 600 /root/.pgpass
                mkdir -p /var/backups/full
                echo "Starting full backup..."
                OUT=/var/backups/full/morphine-postgresql-$(date +"%Y%m%d-%H%M%S").sql
                # No pipe: sh has no pipefail, so a pipe would hide pg_dumpall failures.
                if pg_dumpall -U postgres -h morphine-postgresql > "${OUT}" && gzip "${OUT}"; then
                  echo "Full backup completed successfully"
                  echo "Cleaning up full backups older than 14 days"
                  find /var/backups/full -name "*.sql.gz" -type f -mtime +14 -delete
                else
                  echo "Full backup FAILED" >&2
                  rm -f "${OUT}" "${OUT}.gz"
                  exit 1
                fi
            env:
            - name: PGPASS
              valueFrom:
                secretKeyRef:
                  name: postgresql-pgpass
                  key: pgpass
            volumeMounts:
            - mountPath: /var/backups
              name: postgres-storage
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 750m
                memory: 512Mi
          nodeSelector:
            kubernetes.io/role: worker
          restartPolicy: Never
          volumes:
          - name: postgres-storage
            hostPath:
              path: /data/nfs/postgres-backups
              type: Directory
