{{- if .Values.httpRoute.enabled }}
{{- range $i, $h := .Values.httpRoute.hosts }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ template "kanboard.fullname" $ }}{{ if $i }}-{{ $i }}{{ end }}
  labels:
    {{- include "kanboard.labels" $ | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml $.Values.httpRoute.parentRefs | nindent 4 }}
  hostnames:
    - {{ $h.name | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: security-chain
      backendRefs:
        - name: {{ template "kanboard.fullname" $ }}
          port: {{ $.Values.service.port }}
{{- end }}
{{- end }}
