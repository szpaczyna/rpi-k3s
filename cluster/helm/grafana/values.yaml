## values for grafana
---
serviceAccount:
  name: grafana

headlessService: true

deploymentStrategy:
  type: Recreate

image:
  repository: grafana/grafana
  tag: 10.4.19

livenessProbe:
  httpGet:
    path: /api/health
    port: 3000
  initialDelaySeconds: 60
  timeoutSeconds: 30
  periodSeconds: 10
  failureThreshold: 20

testFramework:
  enabled: false

securityContext:
  fsGroupChangePolicy: OnRootMismatch

downloadDashboards:
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "3000"
  match-regex.version-checker.io/grafana: '(\d+)\.(\d+)\.(\d+)'

service:
  type: ClusterIP
  # type: LoadBalancer
  # loadBalancerIP: "10.0.0.46"
  port: 3000

ingress:
  enabled: false
  # hosts is kept populated (ingress disabled) because grafana.ini below
  # still reads .Values.ingress.hosts to template server.domain / instance_name.
  hosts:
    - grafana.shpaq.org

route:
  main:
    enabled: true
    parentRefs:
      - name: traefik-gateway
        namespace: traefik
        kind: Gateway
        sectionName: websecure
    hostnames:
      - grafana.shpaq.org
    matches:
      - path:
          type: PathPrefix
          value: /
    filters:
      - type: ExtensionRef
        extensionRef:
          group: traefik.io
          kind: Middleware
          name: security-chain

# TLS certificate for route.main.hostnames[0], rendered by the upstream
# chart via extraObjects. It lives in the `traefik` namespace because the
# Gateway's websecure listener may only reference same-namespace Secrets;
# the secret name follows the cluster-wide <hostname-dashed>-tls convention
# and is listed in gateway.listeners.websecure.certificateRefs
# (cluster/helm/traefik).
extraObjects:
  - apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata:
      name: grafana-shpaq-org-tls
      namespace: traefik
    spec:
      dnsNames:
        - grafana.shpaq.org
      issuerRef:
        group: cert-manager.io
        kind: ClusterIssuer
        name: letsencrypt-prod
      secretName: grafana-shpaq-org-tls
      usages:
        - digital signature
        - key encipherment

resources:
  limits:
    cpu: 1000m
    memory: 500Mi
  requests:
    cpu: 200m
    memory: 150Mi

nodeSelector:
  kubernetes.io/role: worker

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: "kubernetes.io/role"
              operator: In
              values:
                - "worker"

persistence:
  type: pvc
  enabled: true
  storageClassName: longhorn
  volumeName: "data-grafana"
  accessModes:
    - ReadWriteOnce
  size: 2Gi
  finalizers:
    - kubernetes.io/pvc-protection
  lookupVolumeName: true
  #existingClaim: "data-grafana"
  extraPvcLabels: {}
  disableWarning: false
  inMemory:
    enabled: false

initChownData:
  resources:
    limits:
      cpu: 50m
      memory: 64Mi
    requests:
      cpu: 10m
      memory: 16Mi

admin:
  existingSecret: "grafana-admin-creds"

enableServiceLinks: true

extraVolumes: []
#  - name: data-grafana
#    existingClaim: data-grafana

plugins:
  - vonage-status-panel
  - novatec-sdg-panel
  - grafana-polystat-panel

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: prometheus
        access: proxy
        editable: false
        orgId: 1
        type: prometheus
        url: http://prometheus-server-headless:9090
        version: 1
        isDefault: true
      - name: Loki
        type: loki
        typeName: Loki
        access: proxy
        url: http://loki.logging:3100
        timeout:
        orgId: 1
        basicAuth: false
        isDefault: false
        jsonData:
          manageAlerts: false
          tlsSkipVerify: true
          maxLines: 100000
          timeout: 500
        readOnly: false
      - name: PostgreSQL
        type: postgres
        typeName: PostgreSQL
        access: proxy
        url: morphine-postgresql-primary-hl.apps:5432
        user: postgres
        database: postgres
        basicAuth: false
        isDefault: false
        jsonData:
          postgresVersion: 1200
          sslmode: disable
          tlsAuth: false
          tlsAuthWithCACert: false
          tlsConfigurationMethod: file-path
          tlsSkipVerify: true
        readOnly: false

grafana.ini:
  app_mode: production
  instance_name: grafana.shpaq.org

  paths:
    logs: /var/lib/grafana/log
    provisioning: /var/lib/grafana/provisioning

  server:
    domain: grafana.shpaq.org
    enable_gzip: true
    socket: /tmp/grafana.sock

  security:
    encryption_provider: secretKey
    cookie_secure: true
    strict_transport_security: true
    strict_transport_security_preload: true
    content_security_policy: true
    content_security_policy_template: |
      script-src 'self' 'unsafe-eval' 'unsafe-inline' 'strict-dynamic' $NONCE;object-src 'none';font-src 'self';style-src 'self' 'unsafe-inline' blob:;img-src * data:;base-uri 'self';connect-src 'self' grafana.com ws://$ROOT_PATH wss://$ROOT_PATH;manifest-src 'self';media-src 'none';form-action 'self';

  snapshots:
    external_enabled: false

  dashboards:
    versions_to_keep: 5

  users:
    allow_sign_up: false
    allow_org_create: false

  auth.anonymous:
    enabled: false
    org_name: Szpacze Gniazdo
    org_role: Viewer
    hide_version: false

  auth.basic:
    enabled: false

  date_formats:
    default_timezone: 'Europe/Warsaw'
