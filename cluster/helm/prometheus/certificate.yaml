---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: prometheus-shpaq-org-tls
  namespace: monitoring
spec:
  dnsNames:
    - prometheus.shpaq.org
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-prod
  secretName: prometheus-shpaq-org-tls
  usages:
    - digital signature
    - key encipherment
