# Namespaces needing `security-chain-internal` (redirect-https only). Every
# namespace holding a route on the internal gateway belongs here.
namespaces:
  - apps
  - logging
  - media
  - monitoring
# Namespaces also needing the WAN chains `security-chain` and
# `security-chain-nogeo`. These carry geoblock, which is a plugin loaded only
# by traefik-external, so they are useless on the internal gateway. A
# namespace belongs here only while it still has a `*.shpaq.org` route.
externalChainNamespaces:
  - apps
  - auth
  - media
# Namespaces whose routes use Authelia forwardAuth. LAN hosts sit under
# lan.shpaq.org, so the `.shpaq.org` session cookie reaches them. Removing
# the middleware while routes still reference it breaks them: Traefik falls
# through to the catch-all redirect instead of serving the app, so this list
# may only shrink after the routes that need it are gone.
autheliaNamespaces:
  - apps
  - longhorn-system
  - media
  - monitoring
  - traefik
# Namespaces needing `lan-only`, an ipAllowList for 10.0.0.0/24. It relies on
# `externalTrafficPolicy: Local` on both Traefik Services to see client IPs.
lanOnlyNamespaces:
  - logging
  - traefik
