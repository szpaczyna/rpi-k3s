---
# Media Stack Helm Chart Values

global:
  timezone: Europe/Warsaw
  runAsUser: 568
  runAsGroup: 568
  # Fallback profile used if an app doesn't set resourceProfile.
  resources:
    requests:
      cpu: 0.1
      memory: 128Mi
    limits:
      cpu: 1
      memory: 900Mi
  nodeSelector:
    kubernetes.io/role: worker

# Sized from real usage observed via `kubectl top pods -n media --containers`
# (bazarr/radarr ~40-50m CPU / ~230Mi mem, sonarr/lidarr/prowlarr ~150-190Mi,
# readarr ~10m/130Mi, exportarr sidecars ~1-2m/10Mi, transmission idle ~12Mi).
resourceProfiles:
  heavy:
    requests:
      cpu: 150m
      memory: 256Mi
    limits:
      cpu: 750m
      memory: 512Mi
  medium:
    requests:
      cpu: 75m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 384Mi
  light:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
  exportarr:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
  transmission:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 256Mi

media:
  bazarr:
    enable: true
    resourceProfile: heavy
    service:
      port: 6767
    storageSize: 1Gi

  lidarr:
    enable: true
    resourceProfile: medium
    service:
      port: 8686
    storageSize: 1Gi

  prowlarr:
    enable: true
    resourceProfile: medium
    service:
      port: 9696
    storageSize: 1Gi

  radarr:
    enable: true
    resourceProfile: heavy
    service:
      port: 7878
    storageSize: 1Gi

  readarr:
    enable: true
    resourceProfile: light
    service:
      port: 8787
    storageSize: 1Gi

  sonarr:
    enable: true
    resourceProfile: medium
    service:
      port: 8989
    storageSize: 1Gi

transmission:
  flood:
    version: "v1.0.1"
  enable: true
  storageSize: 1Gi
  curl:
    repository: "curlimages/curl"
    tag: "8.16.0"
  service:
    type: ClusterIP
    port: 9091
  loadbalancer:
    ip: "10.0.0.45"
    port: 51413

exportarr:
  service:
    port: 9707

persistence:
  storageClass: local-path
  size: 1000Gi

# Configuration storage for SQLite databases and app configs
# Uses Longhorn for better performance with SQLite databases
configStorage:
  enabled: true
  storageClass: longhorn

images:
  radarr:
    repository: "lscr.io/linuxserver/radarr"
    # tag: "5.28.0"
    tag: "6.0.4"
  sonarr:
    repository: "lscr.io/linuxserver/sonarr"
    tag: "4.0.19"
  lidarr:
    repository: "lscr.io/linuxserver/lidarr"
    # tag: "2.14.5"
    tag: "3.1.0"
  prowlarr:
    repository: "lscr.io/linuxserver/prowlarr"
    tag: "2.3.0"
  readarr:
    repository: "lscr.io/linuxserver/readarr"
    tag: "0.4.18-develop"
  bazarr:
    repository: "lscr.io/linuxserver/bazarr"
    tag: "1.5.4"
  transmission:
    repository: "lscr.io/linuxserver/transmission"
    tag: "4.0.6"
  exportarr:
    repository: "ghcr.io/onedr0p/exportarr"
    tag: "v2.3.0"
  transmissionExporter:
    repository: "szpaczyn/transmission_exporter-arm64"
    tag: "v0.3.0"
  busybox:
    repository: "busybox"
    tag: "1.37.0"

httpRoute:
  enabled: true
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      kind: Gateway
      sectionName: websecure
