{{- if .Values.httpRoute.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: media
  namespace: media
  labels:
    app.kubernetes.io/name: media
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  hostnames:
    - "media.shpaq.org"
  rules:
    # Bare root (no app suffix) has no backend of its own; redirect to the
    # main landing page instead of falling through to a 404.
    - matches:
        - path:
            type: Exact
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: security-chain
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: shpaq.org
            path:
              type: ReplaceFullPath
              replaceFullPath: /
            statusCode: 302
{{- if .Values.transmission.enable }}
    - matches:
        - path:
            type: PathPrefix
            value: "/transmission"
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: security-chain
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: authelia
      backendRefs:
        - name: transmission-http
          port: {{ .Values.transmission.service.port }}
{{- end }}
{{- range $name, $svc := .Values.media }}
{{- if $svc.enable }}
    - matches:
        - path:
            type: PathPrefix
            value: "/{{ $name }}"
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: security-chain
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: authelia
      backendRefs:
        - name: "{{ $name }}"
          port: {{ $svc.service.port }}
{{- end }}
{{- end }}
    # Catch-all: any path not matching an app prefix redirects to the main site.
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: security-chain
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: shpaq.org
            path:
              type: ReplaceFullPath
              replaceFullPath: /
            statusCode: 302

{{- if .Values.calibreWeb.enable }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: calibre-web
  namespace: media
  labels:
    app.kubernetes.io/instance: calibre-web
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  hostnames:
    - "calibre.shpaq.org"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: security-chain
      backendRefs:
        - name: calibre-web
          port: {{ .Values.calibreWeb.service.port }}
{{- end }}
{{- end }}
