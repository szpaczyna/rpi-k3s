{{- if .Values.httpRoute.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: media
  labels:
    app.kubernetes.io/name: media
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  hostnames:
    - {{ .Values.httpRoute.hostname | quote }}
  rules:
    - matches:
        - path:
            type: Exact
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: security-chain-internal
      {{- if .Values.landingPage.enabled }}
      backendRefs:
        - name: landingpage
          port: 80
      {{- else }}
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: shpaq.org
            path:
              type: ReplaceFullPath
              replaceFullPath: /
            statusCode: 302
      {{- end }}
{{- if .Values.transmission.enable }}
    - matches:
        - path:
            type: PathPrefix
            value: "/transmission"
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: security-chain-internal
      backendRefs:
        - name: transmission-http
          port: {{ .Values.transmission.service.port }}
{{- end }}
{{- range $name, $svc := .Values.media }}
{{- if $svc.enable }}
    - matches:
        - path:
            type: PathPrefix
            value: "/{{ $name }}"
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: security-chain-internal
      backendRefs:
        - name: "{{ $name }}"
          port: {{ $svc.service.port }}
{{- end }}
{{- end }}
    # Catch-all: an unknown path bounces back to the landing page rather
    # than leaving for the public site.
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: security-chain-internal
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: {{ .Values.httpRoute.hostname | quote }}
            path:
              type: ReplaceFullPath
              replaceFullPath: /
            statusCode: 302
{{- end }}
