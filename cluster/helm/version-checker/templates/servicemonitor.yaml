{{- if or  .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "version-checker.name" . }}
  labels:
    {{- include "version-checker.labels" . | nindent 4 }}
    {{- if .Values.serviceMonitor.additionalLabels }}
{{- .Values.serviceMonitor.additionalLabels | toYaml | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "version-checker.selectorLabels" . | nindent 6 }}
  endpoints:
  - port: web
    path: /metrics
{{- end }}
