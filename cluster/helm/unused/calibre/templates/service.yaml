{{- if .Values.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: calibre-web
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: calibre-web
spec:
  type: ClusterIP
  ports:
    - name: calibre-web
      port: {{ .Values.service.port }}
      protocol: TCP
      targetPort: calibre-web
  selector:
    app.kubernetes.io/name: calibre-web
{{- end }}
