{{- if .Values.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: calibre-web
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: calibre-web
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: calibre-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: calibre-web
    spec:
      serviceAccountName: {{ .Values.serviceAccountName }}
      dnsPolicy: ClusterFirst
      enableServiceLinks: true
      securityContext: {}
      {{- if .Values.configStorage.enabled }}
      initContainers:
        - name: fix-permissions
          image: "{{ printf "%s:%s" .Values.busybox.repository .Values.busybox.tag }}"
          command:
            - /bin/sh
            - -c
            - chown -R {{ .Values.global.runAsUser }}:{{ .Values.global.runAsGroup }} /config && chmod -R 755 /config
          volumeMounts:
            - mountPath: /config
              name: config
          securityContext:
            runAsUser: 0
      {{- end }}
      containers:
        - name: calibre-web
          image: "{{ printf "%s:%s" .Values.image.repository .Values.image.tag }}"
          imagePullPolicy: Always
          env:
            - name: TZ
              value: "{{ .Values.global.timezone }}"
            - name: PUID
              value: "{{ .Values.global.runAsUser }}"
            - name: PGID
              value: "{{ .Values.global.runAsGroup }}"
            - name: UMASK
              value: "022"
          ports:
            - name: calibre-web
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: {{ .Values.service.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: {{ .Values.service.port }}
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            {{- if .Values.configStorage.enabled }}
            - mountPath: /config
              name: config
            {{- else }}
            - mountPath: /config
              name: media
              subPath: config/calibre-web
            {{- end }}
            - mountPath: /books
              name: media
              subPath: library/books
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: {{ .Values.mediaClaimName }}
        {{- if .Values.configStorage.enabled }}
        - name: config
          persistentVolumeClaim:
            claimName: calibre-web
        {{- end }}
      {{- if .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.global.nodeSelector | nindent 8 }}
      {{- end }}
{{- end }}
