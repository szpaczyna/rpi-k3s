{{- if .Values.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: calibre-web
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: calibre-web
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  hostnames:
    - "{{ .Values.httpRoute.hostname }}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            # security-chain is created per-namespace by the `middlewares`
            # chart (apps/media/monitoring); this chart deploys into media.
            name: security-chain
      backendRefs:
        - name: calibre-web
          port: {{ .Values.service.port }}
{{- end }}
