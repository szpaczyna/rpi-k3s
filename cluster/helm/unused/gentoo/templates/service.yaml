---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gentoo.fullname" . }}
  labels:
    {{- include "gentoo.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  {{- if .Values.service.loadBalancerIP }}
  loadBalancerIP: {{ .Values.service.loadBalancerIP }}
  {{- end }}
  ports:
    {{- range .Values.ports }}
    - name: {{ .name }}
      port: {{ $.Values.service.port }}
      targetPort: {{ .name }}
      protocol: {{ .protocol }}
    {{- end }}
  selector:
    {{- include "gentoo.selectorLabels" . | nindent 4 }}
