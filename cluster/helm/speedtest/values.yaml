---
# Converted from the former plain manifest cluster/apps/speedtest.yaml.
#
# The exporter runs with hostNetwork on a single pinned node. Prometheus
# scrapes it through the static `speedtest` job, so the pod carries no
# prometheus.io/* annotations: a scrape runs a full speed test when the last
# result is older than 10 minutes.

image:
  repository: szpaczyn/speedtest-exporter
  tag: "v2.2.1"
  pullPolicy: IfNotPresent

port: 9469

# TCP only: an HTTP probe on /metrics would start a speed test every 10 minutes.
livenessProbe:
  tcpSocket:
    port: http
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  tcpSocket:
    port: http
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

podAnnotations: {}

securityContext:
  runAsNonRoot: true
  runAsUser: 65535

# hostPID + hostNetwork are required by the exporter to measure the
# node's real connectivity.
hostPID: true
hostNetwork: true

resources:
  requests:
    cpu: 10m
    memory: 24Mi
  limits:
    cpu: 100m
    memory: 128Mi

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/os
              operator: In
              values:
                - linux

tolerations:
  - effect: NoSchedule
    operator: Exists

nodeSelector:
  kubernetes.io/hostname: rpi-k3s-worker-01
