---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pihole-proxy
  namespace: apps
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: kube-system
      kind: Gateway
      sectionName: websecure
  hostnames:
    - "pihole.shpaq.org"
  rules:
    # Equivalent to nginx.ingress.kubernetes.io/app-root: /admin
    # (exact match on "/" takes precedence over the PathPrefix rule below,
    # regardless of declaration order, per Gateway API match precedence rules)
    - matches:
        - path:
            type: Exact
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /admin
            statusCode: 301
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: pihole-proxy
          port: 80
