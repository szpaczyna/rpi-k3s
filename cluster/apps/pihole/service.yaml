---
# Traefik's Gateway API provider does not support ExternalName Services as
# HTTPRoute backendRefs (unlike its Ingress provider, which does). Using a
# selector-less Service + manually managed Endpoints achieves the same
# "point at an external host" result while staying HTTPRoute-compatible.
apiVersion: v1
kind: Service
metadata:
  name: pihole-proxy
  namespace: apps
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: v1
kind: Endpoints
metadata:
  name: pihole-proxy
  namespace: apps
subsets:
  - addresses:
      - ip: 10.0.0.2 # blueberry
    ports:
      - port: 80
