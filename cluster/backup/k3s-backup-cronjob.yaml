---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: k3s-backup
  namespace: kube-system
  labels:
    app: k3s-backup
spec:
  schedule: "1 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    metadata:
      labels:
        app: k3s-backup
    spec:
      template:
        spec:
          restartPolicy: "Never"
          containers:
            - name: k3s-backup
              image: busybox:1.38
              imagePullPolicy: IfNotPresent
              command: ["sh", "-c"]
              args:
                - |
                  set -e
                  echo "[backup] K3s backup start"
                  TIMESTAMP=$(date +%Y%m%d%H%M)
                  BACKUP_FILE="${TIMESTAMP}.tar.gz"
                  echo "[backup] Creating archive: ${BACKUP_FILE}"
                  tar -czf /backup/${BACKUP_FILE} -C /k3s/server db token
                  echo "[backup] Archive created successfully"
                  ls -lh /backup/${BACKUP_FILE}
                  # Pruning only after a good archive keeps the old ones if tar fails every night.
                  echo "[backup] Cleaning up backups older than 14 days"
                  find /backup -name "*.tar.gz" -type f -mtime +14 -delete
                  echo "[backup] K3s backup done"
              volumeMounts:
                - name: k3s-data
                  mountPath: /k3s/server
                  readOnly: true
                - name: backup-storage
                  mountPath: /backup
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
          volumes:
            - name: k3s-data
              hostPath:
                path: /k3s/server
                type: Directory
            - name: backup-storage
              hostPath:
                path: /data/nfs/k3s-backups
                # Fails the pod when the NFS mount is missing instead of writing to the local disk.
                type: Directory
          nodeSelector:
            node-role.kubernetes.io/control-plane: "true"
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
