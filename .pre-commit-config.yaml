---
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-added-large-files
  - id: check-merge-conflict
  - id: detect-private-key
  - id: end-of-file-fixer
  - id: check-json
  - id: check-symlinks
- repo: local
  hooks:
  - id: ensure-sops
    name: Ensure .enc.* files are SOPS-encrypted
    entry: scripts/sops-check.sh
    language: system
    files: '\.enc\.'
- repo: https://github.com/adrienverge/yamllint.git
  rev: v1.35.1
  hooks:
  - id: yamllint
    args:
    - -c
    - .github/.yamllint.config.yaml
    # sops-encrypted files are ciphertext, not styleable YAML (and some are
    # multi-document). Skip *.enc.* — they are guarded by ensure-sops.
    exclude: '\.enc\.'
- repo: https://github.com/sirosen/fix-smartquotes
  rev: 0.2.0
  hooks:
  - id: fix-smartquotes
- repo: https://github.com/Lucas-C/pre-commit-hooks
  rev: v1.5.1
  hooks:
  - id: forbid-crlf
  - id: remove-crlf
- repo: https://github.com/Yelp/detect-secrets
  rev: v1.5.0
  hooks:
  - id: detect-secrets
    args: ['--baseline', '.secrets.baseline', '--exclude-files', '\.enc\.']
    # sops files (already encrypted, covered by ensure-sops) and the
    # baseline itself are not scanned.
    exclude: '^\.secrets\.baseline$|\.enc\.'
