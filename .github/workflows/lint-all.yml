---
name: Lint & Validate
permissions:
  contents: read

on:
  pull_request:
    paths-ignore:
      - 'secrets/**'
  push:
    branches: [ main ]
    paths-ignore:
      - 'secrets/**'
  workflow_dispatch: {}

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  yaml:
    name: YAML Lint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: yamllint
        uses: ibiqlik/action-yamllint@v3.1.1
        with:
          file_or_dir: '.'
          config_file: '.github/.yamllint.config.yaml'

  markdown:
    name: Markdown Lint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: markdownlint (informational)
        continue-on-error: true
        uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: '**/*.md !CHANGELOG.md'
          config: '.markdownlint.json'
      - name: Markdown summary
        run: echo 'Markdown lint completed (non-blocking).'

  shell:
    name: ShellCheck
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      # Most scripts here (deploy, decrypt) have no .sh suffix, so they are
      # picked by shebang. zsh-plugins is vendored zsh that shellcheck cannot parse.
      - name: ShellCheck
        run: |
          git ls-files -z -- ':!:provision/ansible/roles/dotfiles/files/zsh-plugins/**' ':!:*.enc.*' \
            | while IFS= read -r -d '' f; do
                head -n1 "$f" | grep -qE '^#!.*[/ ](ba|da)?sh( |$)' && printf '%s\0' "$f"
              done \
            | xargs -0 shellcheck -x

  kubeconform:
    name: Kubeconform (Rendered Helm & Raw Manifests)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up Helm
        uses: azure/setup-helm@v5.1.0
        with:
          version: v4.3.2
      - name: Lint and render local Helm charts
        run: |
          set -euo pipefail
          mkdir -p rendered
          for d in cluster/helm/*/; do
            chart="${d%/}"; name=$(basename "$chart")
            # Upstream charts are only a values file and a deploy script.
            [ -f "$chart/Chart.yaml" ] || continue
            values_args=()
            if [ -f "$chart/values.yaml" ]; then
              values_args+=(--values "$chart/values.yaml")
            elif [ -f "$chart/values-public.yaml" ]; then
              # Encrypted-secrets chart: lint structure/schema against the
              # public values plus a placeholder for the keys values.enc.yaml
              # would normally provide. values.enc.yaml itself is never
              # decrypted here.
              values_args+=(--values "$chart/values-public.yaml")
              stub=".github/ci-stub-values/${name}.yaml"
              [ -f "$stub" ] && values_args+=(--values "$stub")
            else
              echo " skipping $name (no values.yaml or values-public.yaml present)";
              continue
            fi
            echo "Linting and rendering $name"
            helm dependency update "$chart" || true
            helm lint --quiet "$chart" "${values_args[@]}"
            helm template "$name" "$chart" "${values_args[@]}" > "rendered/${name}.yaml"
          done
      - name: Run kubeconform
        uses: docker://ghcr.io/yannh/kubeconform:v0.8.0
        with:
          args: -strict -ignore-missing-schemas -schema-location default -summary rendered

  kube_linter:
    name: Kube Linter
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: kube-linter
        uses: stackrox/kube-linter-action@v1.0.7
        with:
          # Run from repo root so config discover.paths limits scope; excludePaths handles exclusions
          directory: .
          config: .github/.kube-linter.yaml
        continue-on-error: true

  chart_testing:
    name: Chart Testing
    # The cluster is arm64 and some images (booklore) ship no amd64 build.
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          # ensure full fetch so ct can compare against origin/main (avoid targetBranch does not exist errors)
          fetch-depth: 0
      - name: Set up Helm
        uses: azure/setup-helm@v5.1.0
        with:
          version: v4.3.2
      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.9.0
      - name: Create kind cluster
        uses: helm/kind-action@v1.15.2
        with:
          version: v0.33.0
      - name: Install Gateway API CRDs
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.2.1/standard-install.yaml
      - name: Install Traefik CRDs
        run: |
          # The middlewares chart renders only Traefik Middleware objects.
          # Pinned to the Traefik version the traefik-external chart runs.
          kubectl apply --server-side -f https://raw.githubusercontent.com/traefik/traefik/v3.7.18/docs/content/reference/dynamic-configuration/kubernetes-crd-definition-v1.yml
      - name: Alias the longhorn StorageClass to kind's local-path provisioner
        run: |
          # Several charts hardcode storageClassName: longhorn, which doesn't
          # exist on this ephemeral kind cluster (no Longhorn installed) and
          # left their PVCs stuck Pending. Installing Longhorn itself here
          # isn't practical for a kind-based CI runner, so point a
          # StorageClass named "longhorn" at kind's built-in local-path
          # provisioner instead; the charts under test only need their PVC to
          # bind, not real Longhorn semantics.
          kubectl apply -f - <<'EOF'
          apiVersion: storage.k8s.io/v1
          kind: StorageClass
          metadata:
            name: longhorn
          provisioner: rancher.io/local-path
          volumeBindingMode: WaitForFirstConsumer
          EOF
      - name: Label kind nodes so worker-pinned charts can schedule
        run: |
          # Workloads in this cluster are pinned to kubernetes.io/role: worker,
          # which is a convention of the real fleet. kind has no such label, so
          # every worker-pinned Deployment and DaemonSet stays Pending and
          # `helm install --wait` times out with Available: 0/1. Add the label
          # to the kind nodes so those charts can actually schedule here.
          kubectl label node --all kubernetes.io/role=worker
      - name: Install cert-manager
        run: |
          helm repo add jetstack https://charts.jetstack.io
          helm repo update
          helm upgrade --install cert-manager jetstack/cert-manager \
            --namespace cert-manager \
            --create-namespace \
            --set crds.enabled=true \
            --wait \
            --timeout 5m
      - name: List changed charts
        id: list
        run: |
          changed="$(ct list-changed --config .github/ct.yaml || true)"
          printf '%s\n' "$changed"
          # ct prints one chart per line, and a bare `name=value` cannot carry
          # newlines: with more than one changed chart the step failed with
          # "Invalid format". Flatten to a space-separated list, which is what
          # the next step word-splits anyway.
          flattened="$(printf '%s' "$changed" | tr '\n' ' ' | sed 's/[[:space:]]*$//')"
          echo "changed=$flattened" >> "$GITHUB_OUTPUT"
      # ct's own version check runs only inside `ct lint`, which this job does
      # not use. Docs and operator scripts are not packaged, so they need no bump.
      - name: Require a chart version bump
        if: steps.list.outputs.changed != ''
        env:
          CHANGED_CHARTS: ${{ steps.list.outputs.changed }}
        run: |
          set -euo pipefail
          base="$(git merge-base origin/main HEAD)"
          fail=0
          for c in $CHANGED_CHARTS; do
            git cat-file -e "$base:$c/Chart.yaml" 2>/dev/null || continue
            changed="$(git diff --name-only "$base" HEAD -- "$c" \
              ':(exclude)*.md' ":(exclude)$c/deploy" ":(exclude)$c/decrypt")"
            [ -n "$changed" ] || continue
            old="$(git show "$base:$c/Chart.yaml" | yq -r '.version')"
            new="$(yq -r '.version' "$c/Chart.yaml")"
            top="$(printf '%s\n%s\n' "$old" "$new" | sort -V | tail -n1)"
            if [ "$old" = "$new" ] || [ "$top" != "$new" ]; then
              echo "::error file=$c/Chart.yaml::$c changed but version $new is not above $old"
              fail=1
            fi
          done
          exit "$fail"
      - name: Lint & install eligible charts (skip missing values.yaml)
        if: steps.list.outputs.changed != ''
        env:
          # Through the environment rather than ${{ }} interpolation, so the
          # value cannot end up parsed as shell.
          CHANGED_CHARTS: ${{ steps.list.outputs.changed }}
        run: |
          set -euo pipefail
          changed="$CHANGED_CHARTS"
          eligible=""
          for c in ${changed}; do
            if [ ! -f "$c/Chart.yaml" ]; then
              echo "Skipping $c (no Chart.yaml)"; continue; fi
            if [ ! -f "$c/values.yaml" ]; then
              echo "Skipping $c (no values.yaml - likely encrypted externally)"; continue; fi
            eligible="$eligible $c"
          done
          if [ -z "$eligible" ]; then
            echo "No eligible charts with values.yaml to test."; exit 0; fi
          echo "Eligible charts: $eligible"
          kubectl create namespace chart-test || true
          for c in $eligible; do
            echo "Processing $c";
            helm dependency update "$c" || true
            helm lint "$c"
            rel="test-$(basename "$c")"
            # Charts with an httpRoute.enabled toggle render a cert-manager
            # Certificate for a real public hostname via ACME. That can never
            # succeed in this ephemeral kind cluster (no ClusterIssuer, no
            # public DNS/HTTP-01 reachability), so disable it here -- this
            # step tests that the application itself comes up, not TLS
            # issuance, which doesn't depend on the chart under test anyway.
            install_args=()
            if yq -e '.httpRoute.enabled' "$c/values.yaml" >/dev/null 2>&1; then
              install_args+=(--set httpRoute.enabled=false)
            fi
            # Charts that point at live-only PVCs, Secrets or host paths ship
            # CI overrides next to the values-public stubs.
            stub=".github/ci-stub-values/$(basename "$c").yaml"
            if [ -f "$stub" ]; then
              install_args+=(--values "$stub")
            fi
            # Some charts render resources (e.g. a cross-namespace Certificate
            # for the Gateway websecure listener) into a namespace other than
            # the release namespace. Create every namespace the rendered
            # manifest references so `helm install` doesn't fail on a missing
            # one.
            helm template "$rel" "$c" --namespace chart-test --values "$c/values.yaml" "${install_args[@]}" > /tmp/rendered.yaml
            for ns in $(yq -N e '... | select(has("namespace")) | .namespace' /tmp/rendered.yaml | sort -u); do
              [ "$ns" != "chart-test" ] && kubectl create namespace "$ns" || true
            done
            echo "Installing $rel from $c";
            helm install "$rel" "$c" --namespace chart-test --wait --timeout 10m "${install_args[@]}" || { echo "Install failed for $c"; exit 1; }
            echo "Uninstalling $rel";
            helm uninstall "$rel" --namespace chart-test || true
          done
          kubectl delete namespace chart-test || true
      - name: No chart changes
        if: steps.list.outputs.changed == ''
        run: echo 'No Helm chart changes detected.'
