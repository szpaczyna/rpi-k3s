---
name: Lint & Validate
permissions:
  contents: read

on:
  pull_request:
    paths-ignore:
      - 'secrets/**'
  push:
    branches: [ main ]
    paths-ignore:
      - 'secrets/**'
  workflow_dispatch: {}

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  yaml:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: '.'
          config_file: '.github/.yamllint.config.yaml'

  markdown:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: markdownlint (informational)
        continue-on-error: true
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: '**/*.md !CHANGELOG.md'
          config: '.markdownlint.json'
      - name: Markdown summary
        run: echo 'Markdown lint completed (non-blocking).'

  shell:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        continue-on-error: true
        run: |
          find . -name '*.sh' -type f \
            -not -path './scripts/network/*enc.sh' \
            -not -path './scripts/wireguard.sh' \
            -not -path './scripts/pihole_install.sh' \
            -print0 | xargs -0 shellcheck -x

  kubeconform:
    name: Kubeconform (Rendered Helm & Raw Manifests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.14.0
      - name: Render Helm charts (skip charts with no values at all)
        run: |
          mkdir -p rendered
          for d in cluster/helm/*/; do
            chart="${d%/}"; name=$(basename "$chart")
            values_args=()
            if [ -f "$chart/values.yaml" ]; then
              values_args+=(--values "$chart/values.yaml")
            elif [ -f "$chart/values-public.yaml" ]; then
              # Encrypted-secrets chart: lint structure/schema against the
              # public values plus a placeholder for the keys values.enc.yaml
              # would normally provide. values.enc.yaml itself is never
              # decrypted here.
              values_args+=(--values "$chart/values-public.yaml")
              stub=".github/ci-stub-values/${name}.yaml"
              [ -f "$stub" ] && values_args+=(--values "$stub")
            else
              echo " skipping $name (no values.yaml or values-public.yaml present)";
              continue
            fi
            echo "Rendering $name";
            helm dependency update "$chart" || true
            helm template "$name" "$chart" "${values_args[@]}" > "rendered/${name}.yaml" || {
              echo "Helm template failed for $name; skipping"; continue; }
          done
      - name: Run kubeconform
        uses: docker://ghcr.io/yannh/kubeconform:latest
        with:
          args: -strict -ignore-missing-schemas -schema-location default -summary rendered

  kube_linter:
    name: Kube Linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: kube-linter
        uses: stackrox/kube-linter-action@v1.0.7
        with:
          # Run from repo root so config discover.paths limits scope; excludePaths handles exclusions
          directory: .
          config: .github/.kube-linter.yaml
        continue-on-error: true

  chart_testing:
    name: Chart Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # ensure full fetch so ct can compare against origin/main (avoid targetBranch does not exist errors)
          fetch-depth: 0
      - name: Set up Helm
        uses: azure/setup-helm@v5
      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.8.0
      - name: Create kind cluster
        uses: helm/kind-action@v1.14.0
        with:
          version: v0.31.0
      - name: Install Gateway API CRDs
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.2.1/standard-install.yaml
      - name: Alias the longhorn StorageClass to kind's local-path provisioner
        run: |
          # Several charts hardcode storageClassName: longhorn, which doesn't
          # exist on this ephemeral kind cluster (no Longhorn installed) and
          # left their PVCs stuck Pending. Installing Longhorn itself here
          # isn't practical for a kind-based CI runner, so point a
          # StorageClass named "longhorn" at kind's built-in local-path
          # provisioner instead; the charts under test only need their PVC to
          # bind, not real Longhorn semantics.
          kubectl apply -f - <<'EOF'
          apiVersion: storage.k8s.io/v1
          kind: StorageClass
          metadata:
            name: longhorn
          provisioner: rancher.io/local-path
          volumeBindingMode: WaitForFirstConsumer
          EOF
      - name: Install cert-manager
        run: |
          helm repo add jetstack https://charts.jetstack.io
          helm repo update
          helm upgrade --install cert-manager jetstack/cert-manager \
            --namespace cert-manager \
            --create-namespace \
            --set crds.enabled=true \
            --wait \
            --timeout 5m
      - name: List changed charts
        id: list
        run: |
          changed=$(ct list-changed --config .github/ct.yaml || true)
          echo "changed=$changed" >> $GITHUB_OUTPUT
          echo "$changed"
      - name: Lint & install eligible charts (skip missing values.yaml)
        if: steps.list.outputs.changed != ''
        run: |
          set -euo pipefail
          # initialize changed from the previous step output to avoid unbound variable under 'set -u'
          changed="${{ steps.list.outputs.changed }}"
          eligible=""
          for c in ${changed}; do
            if [ ! -f "$c/Chart.yaml" ]; then
              echo "Skipping $c (no Chart.yaml)"; continue; fi
            if [ ! -f "$c/values.yaml" ]; then
              echo "Skipping $c (no values.yaml - likely encrypted externally)"; continue; fi
            eligible="$eligible $c"
          done
          if [ -z "$eligible" ]; then
            echo "No eligible charts with values.yaml to test."; exit 0; fi
          echo "Eligible charts: $eligible"
          kubectl create namespace chart-test || true
          for c in $eligible; do
            echo "Processing $c";
            helm dependency update "$c" || true
            helm lint "$c"
            rel="test-$(basename "$c")"
            # Charts with an httpRoute.enabled toggle render a cert-manager
            # Certificate for a real public hostname via ACME. That can never
            # succeed in this ephemeral kind cluster (no ClusterIssuer, no
            # public DNS/HTTP-01 reachability), so disable it here -- this
            # step tests that the application itself comes up, not TLS
            # issuance, which doesn't depend on the chart under test anyway.
            install_args=()
            if yq -e '.httpRoute.enabled' "$c/values.yaml" >/dev/null 2>&1; then
              install_args+=(--set httpRoute.enabled=false)
            fi
            # Some charts render resources (e.g. a cross-namespace Certificate
            # for the Gateway websecure listener) into a namespace other than
            # the release namespace. Create every namespace the rendered
            # manifest references so `helm install` doesn't fail on a missing
            # one.
            helm template "$rel" "$c" --namespace chart-test --values "$c/values.yaml" "${install_args[@]}" > /tmp/rendered.yaml
            for ns in $(yq -N e '... | select(has("namespace")) | .namespace' /tmp/rendered.yaml | sort -u); do
              [ "$ns" != "chart-test" ] && kubectl create namespace "$ns" || true
            done
            echo "Installing $rel from $c";
            helm install "$rel" "$c" --namespace chart-test --wait --timeout 10m "${install_args[@]}" || { echo "Install failed for $c"; exit 1; }
            echo "Uninstalling $rel";
            helm uninstall "$rel" --namespace chart-test || true
          done
          kubectl delete namespace chart-test || true
      - name: No chart changes
        if: steps.list.outputs.changed == ''
        run: echo 'No Helm chart changes detected.'
