---

- name: Base system setup (k3s cluster)
  hosts: k3s_cluster
  become: true
  gather_facts: true

  vars_files:
    - ../vars.yml

  tasks:
    - name: System
      ansible.builtin.include_role:
        name: system
      tags: ['system']
    - name: SSH
      ansible.builtin.include_role:
        name: sshd
      tags: ['sshd']
    - name: Dotfiles
      ansible.builtin.include_role:
        name: dotfiles
      tags: ['dotfiles']
    # k3s nodes' container logs and host logs are normally collected by the
    # Fluent Bit DaemonSet (cluster/helm/loki, hostPath /var/log). The master
    # node cannot reach CoreDNS, so its DaemonSet pod crash-loops; install the
    # host agent there instead. Workers keep the DaemonSet only.
    - name: Log shipper (master node only)
      ansible.builtin.include_role:
        name: log_shipper
      tags: ['log-shipper']
      when: inventory_hostname == groups['k3s_master'][0]
