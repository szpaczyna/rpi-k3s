---

- name: Base system setup (k3s cluster)
  hosts: k3s_cluster
  become: true
  gather_facts: true

  vars_files:
    - ../vars.yml

  tasks:
    - name: System
      ansible.builtin.include_role:
        name: system
      tags: ['system']
    - name: SSH
      ansible.builtin.include_role:
        name: sshd
      tags: ['sshd']
    - name: Dotfiles
      ansible.builtin.include_role:
        name: dotfiles
      tags: ['dotfiles']
    # k3s nodes' container logs and host logs are collected by the Fluent Bit
    # DaemonSet (cluster/helm/loki, hostPath /var/log). No host agent needed.
