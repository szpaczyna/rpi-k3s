---
- name: Uninstall k3s cluster
  hosts: k3s_cluster
  become: true
  gather_facts: true
  any_errors_fatal: true
  pre_tasks:
    - name: Pausing for 5 seconds...
      ansible.builtin.pause:
        seconds: 5
  tasks:
    - name: Load k3s role defaults
      ansible.builtin.include_vars: "{{ playbook_dir }}/../../roles/k3s/defaults/main.yml"
    - name: Kill k3s
      ansible.builtin.command:
        cmd: /usr/local/bin/k3s-killall.sh
        removes: /usr/local/bin/k3s-killall.sh
      environment:
        K3S_DATA_DIR: "{{ k3s_data_dir }}"
    - name: Uninstall k3s
      ansible.builtin.command:
        cmd: /usr/local/bin/k3s-uninstall.sh
        removes: /usr/local/bin/k3s-uninstall.sh
    - name: Uninstall k3s agent
      ansible.builtin.command:
        cmd: /usr/local/bin/k3s-agent-uninstall.sh
        removes: /usr/local/bin/k3s-agent-uninstall.sh
    - name: Gather list of CNI files to delete
      ansible.builtin.find:
        paths: /etc/cni/net.d
        patterns: "*"
      register: files_to_delete
    - name: Delete CNI files
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ files_to_delete.files }}"
    # Longhorn keeps its volumes in {{ k3s_data_dir }}/storage, so only the k3s state goes.
    - name: Delete k3s state from the data dir
      ansible.builtin.file:
        path: "{{ k3s_data_dir }}/{{ item }}"
        state: absent
      loop:
        - server
        - agent
        - data
