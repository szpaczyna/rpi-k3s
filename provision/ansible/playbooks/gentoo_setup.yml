---

- name: Gentoo hosts setup
  hosts: gentoo
  become: true
  gather_facts: true

  tasks:
    - name: Portage
      ansible.builtin.include_role:
        name: gentoo_portage
      tags: ['gentoo_portage']
    - name: SSH
      ansible.builtin.include_role:
        name: sshd
      tags: ['sshd']
    - name: Dotfiles
      ansible.builtin.include_role:
        name: dotfiles
      tags: ['dotfiles']
    # Fluent Bit is not available in the main Portage tree and is not
    # installed by this play. Install manually from the zGentoo overlay
    # (see provision/ansible/README.md) if host log shipping is needed.
