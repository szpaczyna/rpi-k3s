---
# Every node sits on a /25, not a /24. Both host-gw and vxlan DirectRouting
# require all nodes in one L2 segment, so recheck this before switching.
k3s_node_subnet_cidr: 10.0.0.0/25

# worker-00 exports /data/{nfs,media,cloud} to the rest of the nodes and to the
# Pi-hole box, so it is the one host that needs the server side of NFS. The
# kernel can load nfsd from the root filesystem once it is mounted, but the
# module has to survive an initramfs that gets rebuilt from a rescue image,
# which does not have this fstab.
system_initramfs_extra_modules_by_host:
  rpi-k3s-worker-00:
    - nfs_acl
    - nfsd
