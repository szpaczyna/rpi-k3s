---
# `service` rather than `systemd`: the Gentoo hosts run OpenRC, and the module
# picks the right init per host. `reloaded` keeps existing sessions alive, which
# matters because this role rewrites the config sshd is currently serving.
- name: Reload sshd
  ansible.builtin.service:
    name: "{{ sshd_service_name }}"
    state: reloaded

- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

# One nft transaction replaces the whole table, so existing sessions and the
# allowlist never see a gap.
- name: Reload ssh-geofilter
  ansible.builtin.systemd:
    name: ssh-geofilter.service
    state: reloaded
  ignore_errors: "{{ ansible_check_mode }}"
