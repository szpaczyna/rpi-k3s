#You probably already put this in
set -g prefix C-a
unbind-key C-b
bind-key C-a send-prefix

# 0 is too far from ` ;)
set -g base-index 1

# Automatically set window title
set-window-option -g automatic-rename on
set-option -g set-titles on

# tmux-256color carries the italics and extended capabilities that
# xterm-256color lacks; terminal-features advertises 24-bit colour to the
# programs running inside, which nvim needs for termguicolors.
set -g default-terminal "tmux-256color"
set -ga terminal-features ",*:RGB"
set -g status-keys vi
set -g history-limit 30000

setw -g mode-keys vi
setw -g monitor-activity on
set -g mouse on

bind-key X set-window-option synchronize-panes\; display-message "synchronize-panes is now #{?pane_synchronized,on,off}"

bind-key v split-window -h
bind-key s split-window -v

bind-key J resize-pane -D 5
bind-key K resize-pane -U 5
bind-key H resize-pane -L 5
bind-key L resize-pane -R 5

bind-key M-j resize-pane -D
bind-key M-k resize-pane -U
bind-key M-h resize-pane -L
bind-key M-l resize-pane -R

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Use Alt-vim keys without prefix key to switch panes
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# No delay for escape key press
set -sg escape-time 0

# Reload tmux config
bind r source-file ~/.tmux.conf \; display "Reloaded tmux.conf"

# THEME
# Wombat palette and rounded pills from lualine and the tabline in nvim
# (lua/plugins/ui.lua), so the bar under nvim reads as part of it.
set -g status-style "fg=#a8a8a8,bg=#444444"
set -g status-interval 60

set -g status-left ""
set -g status-right "#[fg=#808080,bg=#444444]\uE0B6#[fg=#242424,bg=#808080] %a %b %-d | %H:%M #[fg=#d787af,bg=#808080]\uE0B6#[fg=#242424,bg=#d787af,bold] #{user}@#h #[fg=#d787af,bg=#444444,nobold]\uE0B4"
set -g status-right-length 100

# The colour stays out of the format: an inline #[fg] would override the
# activity and bell styles below.
setw -g window-status-style "fg=#9b988c"
setw -g window-status-format " #W#{?#{||:#{window_activity_flag},#{window_bell_flag}}, \u25CF,} "
setw -g window-status-current-format "#[fg=#8ac6f2,bg=#444444]\uE0B6#[fg=#242424,bg=#8ac6f2,bold]#W#[fg=#8ac6f2,bg=#444444,nobold]\uE0B4"
setw -g window-status-activity-style "fg=#cae682,bold"
setw -g window-status-bell-style "fg=#e5786d,bold"

set -g message-style "fg=#242424,bg=#8ac6f2"
set -g message-command-style "fg=#242424,bg=#e5786d"
