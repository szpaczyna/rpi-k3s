---
# Opt-in, full-system apt upgrade. Not included by any playbook by default:
# run it explicitly (e.g. `ansible-playbook ... --tags apt-upgrade` once the
# role is wired into a play) when you want a one-off full upgrade outside of
# the routine provisioning done by roles/system/tasks/packages.yml.
- name: Upgrade all system packages
  ansible.builtin.apt:
    upgrade: full
    update_cache: true
    cache_valid_time: 3600
    autoclean: true
    autoremove: true
  register: apt_upgrade_result
  retries: 5
  until: apt_upgrade_result is success
