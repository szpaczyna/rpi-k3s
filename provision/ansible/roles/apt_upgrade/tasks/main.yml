---
# Opt-in, full-system apt upgrade. Only playbooks/apt.yaml includes it, so it
# stays out of the routine provisioning done by roles/system/tasks/packages.yml.
- name: Upgrade all system packages
  ansible.builtin.apt:
    upgrade: full
    update_cache: true
    cache_valid_time: 3600
    autoclean: true
    autoremove: true
  register: apt_upgrade_result
  retries: 5
  until: apt_upgrade_result is success
