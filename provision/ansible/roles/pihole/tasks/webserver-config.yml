---
# check_mode: false — this is a read, Ansible must still run it under
# --check so the drift comparison below has real data to compare against.
- name: Read current pihole-FTL webserver config scalars
  ansible.builtin.command:
    cmd: "pihole-FTL --config {{ item.key }}"
  register: pihole_webserver_scalar_current
  changed_when: false
  check_mode: false
  loop: "{{ pihole_webserver_scalars }}"
  loop_control:
    label: "{{ item.key }}"

- name: Set pihole-FTL webserver config scalars that drifted from desired value
  ansible.builtin.command:
    cmd: "pihole-FTL --config {{ item.item.key }} '{{ item.item.value }}'"
  loop: "{{ pihole_webserver_scalar_current.results }}"
  loop_control:
    label: "{{ item.item.key }}"
  when: item.stdout | trim != (item.item.value | string)
  changed_when: true

- name: Read current pihole-FTL webserver config arrays
  ansible.builtin.command:
    cmd: "pihole-FTL --config {{ item.key }}"
  register: pihole_webserver_array_current
  changed_when: false
  check_mode: false
  loop: "{{ pihole_webserver_arrays }}"
  loop_control:
    label: "{{ item.key }}"

- name: Set pihole-FTL webserver config arrays that drifted from desired value
  ansible.builtin.command:
    cmd: >-
      pihole-FTL --config {{ item.item.key }}
      '[ {{ item.item.vals | map('regex_replace', '^(.*)$', '"\1"') | join(', ') }} ]'
  loop: "{{ pihole_webserver_array_current.results }}"
  loop_control:
    label: "{{ item.item.key }}"
  when: >-
    item.stdout | trim != '[ ' + (item.item.vals | join(', ')) + ' ]'
  changed_when: true
