---
pihole_upstreams:
  - '1.1.1.1'
  - '1.0.0.1'
  - '8.8.8.8'
  - '8.8.4.4'
  - '208.67.222.222'
  - '208.67.220.220'

pihole_hosts:
  - '10.0.0.1 unifi.lan.shpaq.org'
  - '10.0.0.2 blueberry.lan.shpaq.org'
  - '10.0.0.3 blueberry.w.lan.shpaq.org'
  - '10.0.0.4 greyhound.lan.shpaq.org'
  - '10.0.0.6 tv.lan.shpaq.org'
  - '10.0.0.7 printer.lan.shpaq.org'
  - '10.0.0.8 sonos.lan.shpaq.org'
  - '10.0.0.9 rpi-k3s-master-00.lan.shpaq.org'
  - '10.0.0.11 rpi-k3s-worker-00.lan.shpaq.org'
  - '10.0.0.12 rpi-k3s-worker-01.lan.shpaq.org'
  - '10.0.0.13 rpi-k3s-worker-02.lan.shpaq.org'
  - '10.0.0.20 greypi.lan.shpaq.org'
  - '10.0.0.21 whitepi.lan.shpaq.org'
  - '10.0.0.22 redpi.lan.shpaq.org'
  - '10.0.0.23 blackpi.lan.shpaq.org'
  - '10.0.0.30 u7.lan.shpaq.org'
  - '10.0.0.42 psql.lan.shpaq.org'
  - '10.0.0.45 transmission.lan.shpaq.org'
  - '10.0.0.41 gitea-ssh.lan.shpaq.org'
  - '10.0.0.40 traefik.lan.shpaq.org'
  - '10.0.0.50 traefik-internal.lan.shpaq.org'
  - '10.0.0.60 ap.lan.shpaq.org'

pihole_cname_records:
  - 'bitwarden.shpaq.org,traefik.lan.shpaq.org'
  - 'gitea.shpaq.org,traefik.lan.shpaq.org'
  - 'shpaq.org,traefik.lan.shpaq.org'
  - 'whoops.shpaq.org,traefik.lan.shpaq.org'
  - 'booklore.shpaq.org,traefik.lan.shpaq.org'
  - 'auth.shpaq.org,traefik.lan.shpaq.org'
  - 'media.lan.shpaq.org,traefik-internal.lan.shpaq.org'
  - 'grafana.lan.shpaq.org,traefik-internal.lan.shpaq.org'
  - 'prometheus.lan.shpaq.org,traefik-internal.lan.shpaq.org'
  - 'longhorn.lan.shpaq.org,traefik-internal.lan.shpaq.org'
  - 'loki.lan.shpaq.org,traefik-internal.lan.shpaq.org'
  - 'pihole.lan.shpaq.org,traefik-internal.lan.shpaq.org'
  - 'homepage.lan.shpaq.org,traefik-internal.lan.shpaq.org'
  # Old .home names of LAN web apps, kept for the Traefik *.home redirect; an A record would shadow these.
  - 'traefik-internal.home,traefik-internal.lan.shpaq.org'
  - 'media.home,media.lan.shpaq.org'
  - 'grafana.home,grafana.lan.shpaq.org'
  - 'prometheus.home,prometheus.lan.shpaq.org'
  - 'longhorn.home,longhorn.lan.shpaq.org'
  - 'loki.home,loki.lan.shpaq.org'
  - 'pihole.home,pihole.lan.shpaq.org'
  - 'homepage.home,homepage.lan.shpaq.org'

pihole_rev_servers:
  - 'true,10.0.0.0/24,10.0.0.1,lan.shpaq.org'

pihole_dns_cname_deep_inspect: true
pihole_dns_block_esni: true
pihole_dns_show_dnssec: true
pihole_dns_block_ttl: 2
pihole_dns_domain_needed: true
pihole_dns_expand_hosts: true
pihole_dns_interface: 'eth0'
pihole_dns_listening_mode: 'LOCAL'
pihole_dns_query_logging: true
pihole_dns_pihole_ptr: 'HOSTNAME'
pihole_dns_reply_when_busy: 'ALLOW'
pihole_dns_bogus_priv: true
pihole_dns_dnssec: false
pihole_dns_localise: true
pihole_dns_domain_name: 'lan.shpaq.org'

pihole_dns_rate_limit_count: 0
pihole_dns_rate_limit_interval: 0

pihole_database_max_db_days: 91
pihole_database_db_import: true
pihole_database_db_interval: 60

pihole_webserver_port: '80,443s,[::]:80,[::]:443s'
pihole_webserver_tls_cert: '/etc/pihole/tls.pem'
pihole_webserver_interface_boxed: false
pihole_webserver_api_exclude_domains:
  - '\\.morphine$'
  - '\\.localhost$'
  - '\\.home$'
  - '\\.lan\\.shpaq\\.org$'
  - '\\.localdomain$'

pihole_adlists:
  - 'https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts'
  - 'https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/pro.mini.txt'
  - 'https://raw.githubusercontent.com/PolishFiltersTeam/KADhosts/master/KADhosts.txt'
  - 'https://raw.githubusercontent.com/FadeMind/hosts.extras/master/add.Spam/hosts'
  - 'https://v.firebog.net/hosts/static/w3kbl.txt'
  - 'https://adaway.org/hosts.txt'
  - 'https://v.firebog.net/hosts/Admiral.txt'
  - 'https://v.firebog.net/hosts/Easyprivacy.txt'
  - 'https://v.firebog.net/hosts/Prigent-Ads.txt'
  - 'https://raw.githubusercontent.com/anudeepND/blacklist/master/adservers.txt'
  - 'https://big.oisd.nl'
  - 'https://v.firebog.net/hosts/Easylist.txt'
